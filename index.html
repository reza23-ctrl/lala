<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LovleyUs</title>
<style>
:root{--bg:#fff0f5;--card:#fff;--pink:#f06a9b;--pink2:#ffd6e5;--txt:#4a2638;--mut:#a67b8d;--sh:0 6px 20px rgba(240,106,155,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3a1f2b;--pink2:#5a2c40;--txt:#ffe6ef;--mut:#d4a0b5}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#3a1f2b;--pink2:#5a2c40;--txt:#ffe6ef;--mut:#d4a0b5}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font:inherit;color:var(--txt);background:var(--card);border:1.5px solid var(--pink2);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
.logo{font-family:"Brush Script MT","Segoe Script",cursive;color:var(--pink);font-size:2.6rem;font-weight:700}
.btn{background:var(--pink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;box-shadow:var(--sh)}
.btn.s{background:var(--pink2);color:var(--txt);box-shadow:none}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:360px;text-align:center;display:grid;gap:12px}
#login small{color:var(--mut)}
#login a{color:var(--pink);cursor:pointer;text-decoration:underline;font-size:.9rem}
.big{font-size:3rem;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
main{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
nav{display:flex;justify-content:space-around;background:var(--card);padding:8px 4px;box-shadow:0 -4px 16px rgba(240,106,155,.12)}
nav button{display:grid;gap:2px;justify-items:center;font-size:.7rem;color:var(--mut);padding:4px 10px;border-radius:12px;position:relative}
nav button span{font-size:1.4rem}
nav button.on{color:var(--pink);font-weight:700}
nav .dot{position:absolute;top:2px;right:6px;background:var(--pink);color:#fff;border-radius:99px;font-size:.6rem;padding:1px 5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h2{font-size:1.2rem}
.hero{background:linear-gradient(135deg,var(--pink),#ff9fc0);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;margin:14px 0}
.hero .n{font-size:3rem;font-weight:800}
.hero .e{position:absolute;right:14px;bottom:4px;font-size:4.2rem;opacity:.9}
.hero button{background:rgba(255,255,255,.25);border-radius:10px;padding:4px 10px;font-size:.75rem;color:#fff;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid button{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;font-weight:600}
.grid button span{font-size:1.5rem}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.b{max-width:78%;padding:10px 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh);word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--pink);color:#fff}
.b time{display:block;font-size:.65rem;opacity:.7;margin-top:2px}
.send{display:flex;gap:8px;padding-top:8px}
.send input{border-radius:99px}
.send button{width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;flex:none}
.tabs{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.tabs button{padding:6px 14px;border-radius:99px;background:var(--pink2);font-size:.85rem;white-space:nowrap}
.tabs button.on{background:var(--pink);color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:16px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:.75rem;text-shadow:0 1px 3px rgba(0,0,0,.5);box-shadow:var(--sh)}
.env{text-align:center;padding:26px 16px}
.env .i{font-size:4.5rem;animation:beat 1.8s infinite}
.paper{background:#fffaf0;color:#5a3a45;border-radius:14px;padding:18px;margin-top:12px;text-align:left;white-space:pre-wrap;line-height:1.6;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
.nt{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--pink2)}
.nt .ic{width:42px;height:42px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;font-size:1.2rem;flex:none}
.nt small{color:var(--mut)}
.nt div{flex:1}
.hd{position:fixed;pointer-events:none;animation:up 1.6s forwards;z-index:9}
@keyframes up{to{transform:translateY(-140px);opacity:0}}
@media(min-width:900px){
#app.on{flex-direction:row-reverse}
nav{flex-direction:column;justify-content:flex-start;gap:6px;width:200px;padding:20px 12px;box-shadow:4px 0 16px rgba(240,106,155,.12)}
nav button{display:flex;gap:10px;font-size:.95rem;width:100%;justify-content:flex-start}
nav button span{font-size:1.2rem}
nav::before{content:"LovleyUs";font-family:"Brush Script MT","Segoe Script",cursive;color:var(--pink);font-size:2rem;font-weight:700;padding:0 10px 14px}
main{max-width:900px}
.grid{grid-template-columns:repeat(4,1fr)}
}
#app,#login{position:relative;z-index:1}
.waves{position:fixed;left:0;right:0;bottom:0;height:110px;z-index:0;pointer-events:none;overflow:hidden}
.waves i{position:absolute;left:0;bottom:0;width:100%;background-repeat:repeat-x;background-size:1200px 100%;animation:wv 18s linear infinite}
.waves i:nth-child(1){height:100%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 120' preserveAspectRatio='none'><path d='M0 60 Q300 0 600 60 T1200 60 V120 H0Z' fill='%23f06a9b' fill-opacity='.2'/></svg>")}
.waves i:nth-child(2){height:78%;animation-duration:12s;animation-direction:reverse;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 120' preserveAspectRatio='none'><path d='M0 60 Q300 0 600 60 T1200 60 V120 H0Z' fill='%23ff9fc0' fill-opacity='.35'/></svg>")}
.waves i:nth-child(3){height:55%;animation-duration:8s;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 120' preserveAspectRatio='none'><path d='M0 60 Q300 0 600 60 T1200 60 V120 H0Z' fill='%23f06a9b' fill-opacity='.4'/></svg>")}
@keyframes wv{to{background-position-x:-1200px}}
body.in .waves{bottom:62px}
@media(min-width:900px){body.in .waves{bottom:0;right:200px}}
.hw{position:absolute;left:0;right:0;bottom:0;height:30px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 120' preserveAspectRatio='none'><path d='M0 60 Q300 0 600 60 T1200 60 V120 H0Z' fill='white' fill-opacity='.28'/></svg>") repeat-x;background-size:600px 100%;animation:wv2 6s linear infinite}
@keyframes wv2{to{background-position-x:-600px}}
.logo span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wh{display:inline-block;transform-origin:70% 70%;animation:hand 2s infinite}
@keyframes hand{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.fl{position:fixed;bottom:-30px;z-index:0;pointer-events:none;opacity:.55;animation:fl 9s linear forwards}
@keyframes fl{50%{transform:translate(18px,-55vh) rotate(12deg)}to{transform:translate(-10px,-110vh) rotate(-12deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="waves"><i></i><i></i><i></i></div>
<section id="login">
  <div class="box">
    <div class="big">💞</div>
    <div class="logo"><span>L</span><span style="animation-delay:.1s">o</span><span style="animation-delay:.2s">v</span><span style="animation-delay:.3s">l</span><span style="animation-delay:.4s">e</span><span style="animation-delay:.5s">y</span><span style="animation-delay:.6s">U</span><span style="animation-delay:.7s">s</span></div>
    <small>Bersama dalam setiap cerita ♥</small>
    <input id="u" placeholder="Email atau Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go">Masuk</button>
    <a id="reg">Daftar akun</a>
    <small id="msg"></small>
  </div>
</section>
<section id="app">
  <main id="view"></main>
  <nav id="nav"></nav>
</section>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var S={user:"",mode:"login",start:"2025-01-23",chat:[],photos:[],letters:[],read:{},tab:"Semua",page:"home"};
var KEY="lovleyus_v1";
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d)for(var k in d)S[k]=d[k]}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function hm(t){var d=new Date(t);return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function days(){var a=new Date(S.start+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.max(0,Math.round((b-a)/864e5))}
function fdate(s){try{return new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s}}
function hearts(x,y){for(var i=0;i<6;i++){var h=document.createElement("div");h.className="hd";h.textContent="💗";h.style.left=(x+(Math.random()*60-30))+"px";h.style.top=(y-10)+"px";h.style.fontSize=(14+Math.random()*14)+"px";document.body.appendChild(h);setTimeout(function(e){e.remove()},1600,h)}}
document.addEventListener("click",function(e){if(e.target.closest(".btn,.grid button,.send button"))hearts(e.clientX,e.clientY)});

var pages=[["home","🏠","Beranda"],["chat","💬","Chat"],["album","🖼️","Album"],["letter","💌","Surat"],["notif","🔔","Notifikasi"]];
function notifs(){
  var l=[{i:"❤️",t:"Hari jadian kalian",s:"Sudah "+days()+" hari bersama",w:"Hari ini",c:"Momen"}];
  S.letters.slice(-2).forEach(function(x){l.push({i:"💌",t:"Surat cinta baru",s:x.title||"Surat untuk kamu",w:fdate(x.date),c:"Pesan"})});
  var m=S.chat.filter(function(c){return !c.me}).slice(-1)[0];
  if(m)l.unshift({i:"💬",t:"Pasanganmu mengirim pesan",s:m.t,w:hm(m.at),c:"Pesan"});
  l.push({i:"🔔",t:"Pengingat",s:"Jangan lupa, besok anniversary bulanan kalian!",w:"Kemarin",c:"Sistem"});
  return l;
}
function nav(){
  $("#nav").innerHTML=pages.map(function(p){
    var b=p[0]==="notif"?'<i class="dot">'+notifs().length+'</i>':"";
    return '<button data-p="'+p[0]+'" class="'+(S.page===p[0]?"on":"")+'"><span>'+p[1]+'</span>'+p[2]+b+'</button>';
  }).join("");
}
var V={
home:function(){
  return '<div class="top"><div><h2>Hai, '+esc(S.user)+' <span class="wh">👋</span> ♥</h2><small style="color:var(--mut)">Terima kasih sudah selalu ada</small></div><button id="th" title="Tema">🌗</button></div>'+
  '<div class="hero">♥ Hari Jadian<div class="n">'+days()+' hari</div><div>'+fdate(S.start)+'</div><button id="ed">Ubah tanggal</button><div class="e">👫</div><div class="hw"></div></div>'+
  '<div class="grid">'+pages.slice(1).map(function(p){return '<button data-p="'+p[0]+'"><span>'+p[1]+'</span>'+p[2]+'</button>'}).join("")+'</div>';
},
chat:function(){
  var m=S.chat.map(function(c){return '<div class="b'+(c.me?" me":"")+'">'+esc(c.t)+'<time>'+hm(c.at)+'</time></div>'}).join("")||'<p style="text-align:center;color:var(--mut);margin-top:30px">Mulai percakapan manis ♥</p>';
  return '<div class="chat" style="height:calc(100vh - 110px)"><div class="top"><h2>💬 Sayang <small style="color:#4caf50;font-size:.7rem">● Online</small></h2></div><div class="msgs" id="ms">'+m+'</div><div class="send"><input id="ci" placeholder="Tulis pesan..."><button id="cs">➤</button></div></div>';
},
album:function(){
  var tabs=["Semua","Kita","Liburan","Tanggal"];
  var list=S.photos.filter(function(p){return S.tab==="Semua"||p.tag===S.tab});
  var g=["linear-gradient(135deg,#ff9fc0,#ffd6e5)","linear-gradient(135deg,#f9a875,#f06a9b)","linear-gradient(135deg,#b69cf0,#ff9fc0)","linear-gradient(135deg,#7fc8f8,#ffd6e5)"];
  return '<div class="top"><h2>🖼️ Album Foto</h2></div><div class="tabs">'+tabs.map(function(t){return '<button data-t="'+t+'" class="'+(S.tab===t?"on":"")+'">'+t+'</button>'}).join("")+'</div>'+
  '<div style="margin-bottom:12px"><label class="btn s" style="display:inline-block;cursor:pointer">＋ Tambah Foto<input id="fi" type="file" accept="image/*" hidden></label></div>'+
  '<div class="photos">'+(list.map(function(p,i){return '<div class="ph" style="background-image:url('+p.src+')">'+esc(p.cap)+'</div>'}).join("")||[0,1,2,3].map(function(i){return '<div class="ph" style="background:'+g[i]+'">'+["💑","🌅","🤝","✨"][i]+'</div>'}).join(""))+'</div>';
},
letter:function(){
  var ls=S.letters.map(function(l,i){
    return '<div class="card env" style="margin-bottom:12px"><div class="i">💌</div><p>'+esc(l.title||"Surat untuk kamu")+'</p><small style="color:var(--mut)">'+fdate(l.date)+'</small><br><button class="btn" data-o="'+i+'" style="margin-top:10px">Buka Surat</button><div id="o'+i+'"></div></div>';
  }).join("")||'<div class="card env"><div class="i">💌</div><p>Untuk kamu,<br>dari hati yang selalu sama denganmu ♥</p></div>';
  return '<div class="top"><h2>💌 Surat Cinta</h2></div>'+ls+'<div class="card" style="display:grid;gap:10px;margin-top:12px"><b>Tulis surat spesial</b><input id="lt" placeholder="Judul surat"><textarea id="lb" rows="5" placeholder="Tulis isi hatimu..."></textarea><button class="btn" id="lk">Kirim Surat ♥</button></div>';
},
notif:function(){
  var cats=["Semua","Pesan","Momen","Sistem"];
  var l=notifs().filter(function(n){return S.ntab===undefined||S.ntab==="Semua"||n.c===S.ntab});
  return '<div class="top"><h2>🔔 Notifikasi</h2></div><div class="tabs">'+cats.map(function(t){return '<button data-n="'+t+'" class="'+((S.ntab||"Semua")===t?"on":"")+'">'+t+'</button>'}).join("")+'</div><div class="card">'+l.map(function(n){return '<div class="nt"><div class="ic">'+n.i+'</div><div><b>'+esc(n.t)+'</b><br><small>'+esc(n.s)+'</small></div><small>'+esc(n.w)+'</small></div>'}).join("")+'</div>';
}};
function render(){
  $("#view").innerHTML=V[S.page]();nav();
  var ms=$("#ms");if(ms)ms.scrollTop=ms.scrollHeight;
}
function go(p){S.page=p;render()}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-p],[data-t],[data-n],[data-o]");
  if(t){
    if(t.dataset.p)return go(t.dataset.p);
    if(t.dataset.t){S.tab=t.dataset.t;return render()}
    if(t.dataset.n){S.ntab=t.dataset.n;return render()}
    if(t.dataset.o){var l=S.letters[t.dataset.o];$("#o"+t.dataset.o).innerHTML='<div class="paper">'+esc(l.body)+'</div>';t.style.display="none";return}
  }
  var id=e.target.id;
  if(id==="cs")sendChat();
  if(id==="th"){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
  if(id==="ed"){var v=prompt("Tanggal jadian (YYYY-MM-DD):",S.start);if(v&&!isNaN(new Date(v))){S.start=v;save();render()}}
  if(id==="lk"){var b=$("#lb").value.trim();if(!b)return;S.letters.push({title:$("#lt").value.trim(),body:b,date:new Date().toISOString().slice(0,10)});save();render()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ci")sendChat()});
document.addEventListener("change",function(e){
  if(e.target.id!=="fi"||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){var cap=prompt("Keterangan foto:","Kenangan kita")||"";var tag=prompt("Kategori (Kita / Liburan / Tanggal):","Kita")||"Kita";S.photos.push({src:r.result,cap:cap,tag:tag});save();render()};
  r.readAsDataURL(e.target.files[0]);
});
var rep=["Aku juga mikirin kamu 🥰","Hehe, semangat ya! 💪","Sayang banget sama kamu ♥","Nanti kita ketemu ya 😘"];
function sendChat(){
  var i=$("#ci"),t=i.value.trim();if(!t)return;
  S.chat.push({t:t,me:1,at:Date.now()});save();render();
  setTimeout(function(){S.chat.push({t:rep[Math.floor(Math.random()*rep.length)],me:0,at:Date.now()});save();if(S.page==="chat")render();else nav()},1200);
  setTimeout(function(){var n=$("#ci");if(n)n.focus()},0);
}
function enter(){$("#login").style.display="none";document.body.classList.add("in");$("#app").classList.add("on");render()}
$("#reg").onclick=function(){S.mode=S.mode==="login"?"reg":"login";$("#go").textContent=S.mode==="login"?"Masuk":"Daftar";$("#reg").textContent=S.mode==="login"?"Daftar akun":"Sudah punya akun? Masuk";$("#msg").textContent=""};
$("#go").onclick=function(){
  var u=$("#u").value.trim(),p=$("#p").value;
  if(!u||p.length<4){$("#msg").textContent="Isi nama dan password (min. 4 karakter).";return}
  S.user=u.split("@")[0];S.auth=btoa(unescape(encodeURIComponent(u+":"+p)));S.name=u;save();enter();
};
setInterval(function(){var h=document.createElement("div");h.className="fl";h.textContent=["💗","💕","✨","🫧"][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+"vw";h.style.fontSize=(12+Math.random()*16)+"px";document.body.appendChild(h);setTimeout(function(){h.remove()},9000)},1400);
load();
if(S.auth&&S.user){enter()}
})();
</script>
</body>
</html>
