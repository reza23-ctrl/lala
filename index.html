<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinta Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd3e0;--rose:#e8576f;--lilac:#e9ddff;--mint:#c4ecdb;--sun:#ffe9a8;--ink:#4a2f3a;--paper:#fff7fa;font-family:'Fredoka','Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);background-image:radial-gradient(#ffc2d4 1.4px,transparent 1.4px);background-size:22px 22px;color:var(--ink);overflow:hidden;padding-top:env(safe-area-inset-top,0)}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;position:relative;z-index:2}
.hand{font-family:'Patrick Hand','Segoe Print',cursive}
h1,h2,h3{margin:0}
.tabs{display:flex;background:#fff;border-top:3px dashed var(--pink);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;font:inherit;font-size:12px;color:#a97a89}
.tabs button span{display:block;font-size:22px}
.tabs button.on{color:var(--rose);font-weight:600}
.btn{border:0;border-radius:999px;background:var(--rose);color:#fff;font:inherit;font-weight:600;padding:10px 20px;box-shadow:0 4px 0 #b83b52;cursor:pointer;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b83b52}
.btn.alt{background:#fff;color:var(--rose);box-shadow:0 4px 0 var(--pink)}
.btn.sm{padding:6px 14px;font-size:14px}
input,textarea{width:100%;border:2px solid var(--pink);border-radius:14px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);margin:4px 0 8px}
input:focus,textarea:focus{outline:3px solid var(--lilac)}
label{font-size:14px}
/* beranda */
.hero{text-align:center;padding-top:6px}
.hero h1{font-size:30px;line-height:1.15}
.names{font-size:26px;color:var(--rose);margin-top:4px;cursor:pointer}
.count{background:#fff;border-radius:22px;padding:16px;margin:16px 6px;transform:rotate(-1.5deg);box-shadow:0 6px 0 var(--pink);position:relative}
.count b{font-size:54px;color:var(--rose);display:block;line-height:1}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(190,170,255,.55);transform:rotate(3deg)}
.bunny{width:170px;height:190px;margin:0 auto;display:block;cursor:pointer;overflow:visible}
.wave{transform-origin:128px 128px;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-28deg)}60%{transform:rotate(10deg)}}
.ear{transform-origin:70px 60px;animation:ear 3s ease-in-out infinite}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.bubble{display:inline-block;background:#fff;border:2px solid var(--pink);border-radius:18px;padding:6px 14px;font-size:20px;margin-bottom:6px}
/* floating bits */
.fl{position:fixed;pointer-events:none;z-index:50;animation:rise var(--d,4s) ease-in forwards;opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--x,0)) scale(1.1) rotate(var(--r,20deg));opacity:0}}
.star{position:fixed;pointer-events:none;z-index:99;font-size:16px;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}
/* kenangan */
.sect-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tl{position:relative;margin-left:14px;padding-left:20px;border-left:4px dotted var(--rose)}
.pol{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 5px 12px rgba(120,60,80,.18);margin:0 0 26px;position:relative;cursor:pointer;transform:rotate(var(--rot,-1.5deg))}
.pol:before{content:"";position:absolute;left:-30px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--rose);border:4px solid var(--paper)}
.pol img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;display:block;background:var(--lilac)}
.pol .ph{aspect-ratio:4/3;background:var(--lilac);display:grid;place-items:center;font-size:42px;border-radius:3px}
.pol h3{font-size:22px;margin-top:8px}
.meta{font-size:14px;color:#a97a89}
.stk{position:absolute;right:-8px;top:-14px;font-size:30px;transform:rotate(14deg)}
.hint{text-align:center;color:#a97a89;padding:30px 10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(74,47,58,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--paper);border-radius:24px;padding:18px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:in .3s ease-out}
@keyframes in{from{transform:scale(.85);opacity:0}}
.sheet img{width:100%;border-radius:8px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
/* musik */
.disc{width:150px;height:150px;border-radius:50%;margin:10px auto 14px;background:radial-gradient(circle,var(--paper) 0 14%,var(--rose) 15% 30%,#ff9db3 31% 60%,var(--pink) 61%);box-shadow:0 6px 0 #f3b3c6;display:grid;place-items:center;font-size:44px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ctrl{display:flex;justify-content:center;gap:12px;align-items:center}
.ctrl .btn{width:54px;height:54px;padding:0;font-size:22px}
.vol{display:flex;align-items:center;gap:10px;margin:18px 6px}
input[type=range]{margin:0;padding:0;border:0;accent-color:var(--rose)}
/* surat */
.env{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--pink);cursor:pointer}
.env .ic{font-size:34px}.env.lock{opacity:.75}
.stage{height:200px;position:relative;margin:20px auto 0;width:260px}
.env3{position:absolute;bottom:0;left:0;width:260px;height:150px;background:#ffb8cb;border-radius:8px;z-index:3}
.env3:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#ff9db3 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#ff9db3 50%) right/50% 100% no-repeat;border-radius:8px}
.flap{position:absolute;bottom:150px;left:0;width:260px;height:80px;background:#ff8fab;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:rotateX(0);transform-style:preserve-3d;transition:transform .8s;z-index:4;top:auto}
.open .flap{transform:rotateX(180deg);z-index:1}
.paper{position:absolute;left:15px;bottom:6px;width:230px;height:130px;background:#fff;border-radius:6px;z-index:2;transition:transform .9s .6s;padding:10px;font-size:12px;overflow:hidden}
.open .paper{transform:translateY(-110px)}
.letter{background:#fff;border-radius:14px;padding:18px;margin-top:16px;font-size:22px;line-height:1.4;white-space:pre-wrap;background-image:linear-gradient(transparent 30px,#ffe3ec 31px);background-size:100% 31px;box-shadow:0 5px 12px rgba(120,60,80,.15);animation:in .5s ease-out}
@media (prefers-reduced-motion:reduce){.wave,.ear,.spin{animation:none}.fl{display:none}}
</style></head><body>
<div id="app"><main id="main"></main>
<nav class="tabs" id="tabs"></nav></div>
<div id="modalRoot"></div>

<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={n1:'',n2:'',start:'',mem:[],let:[],vol:.5,mute:false,tr:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('cintakita')||'{}'))}catch(e){}
let warn=false;
function save(){try{localStorage.setItem('cintakita',JSON.stringify(S))}catch(e){if(!warn){warn=true;alert('Penyimpanan penuh. Hapus beberapa foto agar data baru tersimpan.')}}}
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);

/* efek */
function floatEl(ch,x,dur){const e=document.createElement('div');e.className='fl';e.textContent=ch;e.style.left=x+'vw';e.style.bottom='-30px';e.style.fontSize=(16+Math.random()*22)+'px';e.style.setProperty('--d',dur+'s');e.style.setProperty('--x',(Math.random()*80-40)+'px');e.style.setProperty('--r',(Math.random()*60-30)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),dur*1000)}
function hearts(n=14){const h=['💗','💖','💕','🩷','💘'];for(let i=0;i<n;i++)setTimeout(()=>floatEl(h[i%5],Math.random()*92,3+Math.random()*2.5),i*140)}
function stars(x,y){const c=['⭐','✨','🌟','💫'];for(let i=0;i<9;i++){const s=document.createElement('div');s.className='star';s.textContent=c[i%4];s.style.left=x+'px';s.style.top=y+'px';const a=i/9*6.28,r=40+Math.random()*40;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}
document.addEventListener('click',e=>{if(e.target.closest('button,.btn'))stars(e.clientX,e.clientY)});

/* navigasi */
const TABS=[['home','🏡','Beranda'],['mem','📸','Kenangan'],['mus','🎵','Musik'],['let','💌','Surat']];
let tab='home';
function nav(){$('#tabs').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render()}}}
function render(){nav();({home,mem,mus,let:letters})[tab]();$('#main').scrollTop=0}

/* beranda */
const MSG=['Halo, sayang! 💕','Aku kangen kamu~','Semangat hari ini!','Kamu paling manis 🍓','Peluk jauh! 🤗'];
function home(){
 const days=S.start?Math.floor((new Date(today())-new Date(S.start))/864e5):null;
 $('#main').innerHTML=`<div class="hero">
 <div class="bubble hand" id="bub">${MSG[0]}</div>
 <svg class="bunny" id="bunny" viewBox="0 0 160 190"><g class="ear"><ellipse cx="62" cy="42" rx="14" ry="38" fill="#fff" stroke="#e8a3b6" stroke-width="3"/><ellipse cx="62" cy="46" rx="6" ry="26" fill="#ffc2d4"/></g><ellipse cx="98" cy="40" rx="14" ry="36" fill="#fff" stroke="#e8a3b6" stroke-width="3" transform="rotate(10 98 40)"/><ellipse cx="98" cy="44" rx="6" ry="24" fill="#ffc2d4" transform="rotate(10 98 44)"/>
 <ellipse cx="80" cy="150" rx="40" ry="34" fill="#fff" stroke="#e8a3b6" stroke-width="3"/><circle cx="80" cy="102" r="42" fill="#fff" stroke="#e8a3b6" stroke-width="3"/>
 <circle cx="64" cy="98" r="5" fill="#4a2f3a"/><circle cx="96" cy="98" r="5" fill="#4a2f3a"/><circle cx="62" cy="96" r="1.6" fill="#fff"/><circle cx="94" cy="96" r="1.6" fill="#fff"/>
 <ellipse cx="52" cy="112" rx="8" ry="5" fill="#ffb3c6" opacity=".8"/><ellipse cx="108" cy="112" rx="8" ry="5" fill="#ffb3c6" opacity=".8"/>
 <path d="M75 110q5 6 10 0" stroke="#e8576f" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="106" rx="4" ry="3" fill="#e8576f"/>
 <ellipse cx="46" cy="150" rx="9" ry="16" fill="#fff" stroke="#e8a3b6" stroke-width="3" transform="rotate(10 46 150)"/>
 <g class="wave"><ellipse cx="132" cy="112" rx="9" ry="18" fill="#fff" stroke="#e8a3b6" stroke-width="3" transform="rotate(-20 132 112)"/></g>
 <text x="64" y="186" font-size="18">💗</text></svg>
 <h1>Cinta Kita</h1>
 <div class="names hand" id="nm">${S.n1||S.n2?esc(S.n1)+' 💞 '+esc(S.n2):'Ketuk untuk isi nama kalian'}</div></div>
 <div class="count hand"><div class="tape"></div>${days===null?'<div>Isi tanggal jadian dulu ya 💝</div>':days<0?'<div>Belum jadian? Cek tanggalnya ya 😄</div>':`<div>Hari ke-</div><b>${days+1}</b><div>bersama sejak ${fmt(S.start)}</div>`}</div>
 <div style="text-align:center"><button class="btn" id="setBtn">Atur nama &amp; tanggal</button></div>`;
 hearts(10);
 let m=0;$('#bunny').onclick=()=>{m=(m+1)%MSG.length;$('#bub').textContent=MSG[m];hearts(6)};
 const set=()=>{modal(`<h2>Tentang kita 💞</h2><label>Namamu</label><input id="a" value="${esc(S.n1)}"><label>Nama pasanganmu</label><input id="b" value="${esc(S.n2)}"><label>Tanggal jadian</label><input id="c" type="date" value="${S.start}"><div class="row"><button class="btn alt" data-x>Batal</button><button class="btn" id="ok">Simpan</button></div>`);
 $('#ok').onclick=()=>{S.n1=$('#a').value.trim();S.n2=$('#b').value.trim();S.start=$('#c').value;save();closeM();render()}};
 $('#setBtn').onclick=set;$('#nm').onclick=set;
}

/* modal */
function modal(h,cls=''){$('#modalRoot').innerHTML=`<div class="modal" id="mm"><div class="sheet ${cls}">${h}</div></div>`;$('#mm').onclick=e=>{if(e.target.id=='mm'||e.target.closest('[data-x]'))closeM()}}
function closeM(){$('#modalRoot').innerHTML=''}

/* kenangan */
const STK=['🧸','🌸','⭐','🍓','🎀','🌈','🦋','🍰'];
function mem(){
 const list=[...S.mem].sort((a,b)=>a.date<b.date?-1:1);
 $('#main').innerHTML=`<div class="sect-h"><h2>Album kenangan 📸</h2><button class="btn sm" id="add">+ Tambah</button></div>
 ${list.length?`<div class="tl">${list.map((m,i)=>`<div class="pol" data-id="${m.id}" style="--rot:${i%2?1.6:-1.6}deg"><div class="stk">${STK[i%STK.length]}</div>${m.img?`<img src="${m.img}" alt="">`:'<div class="ph">💞</div>'}<h3 class="hand">${esc(m.title)}</h3><div class="meta">${fmt(m.date)}${m.place?' · 📍'+esc(m.place):''}</div></div>`).join('')}</div>`:'<div class="hint hand" style="font-size:20px">Belum ada kenangan.<br>Mulai dari hari pertama kalian 💕</div>'}`;
 $('#add').onclick=addMem;
 $('#main').onclick=e=>{const p=e.target.closest('.pol');if(!p)return;const m=S.mem.find(x=>x.id==p.dataset.id);
  modal(`${m.img?`<img src="${m.img}" alt="">`:''}<h2 class="hand" style="font-size:28px;margin-top:10px">${esc(m.title)}</h2><div class="meta">${fmt(m.date)}${m.place?' · 📍'+esc(m.place):''}</div><p class="hand" style="font-size:20px;white-space:pre-wrap">${esc(m.story)}</p><div class="row"><button class="btn alt" id="del">Hapus</button><button class="btn" data-x>Tutup</button></div>`);hearts(16);
  $('#del').onclick=()=>{if(confirm('Hapus kenangan ini?')){S.mem=S.mem.filter(x=>x.id!=m.id);save();closeM();mem()}}}
}
function addMem(){
 modal(`<h2>Kenangan baru 💗</h2><label>Foto berdua</label><input id="f" type="file" accept="image/*"><label>Judul</label><input id="t" placeholder="Kencan pertama"><label>Tanggal</label><input id="d" type="date" value="${today()}"><label>Lokasi</label><input id="p" placeholder="Kafe favorit"><label>Cerita</label><textarea id="s" rows="4" placeholder="Hari itu kita..."></textarea><div class="row"><button class="btn alt" data-x>Batal</button><button class="btn" id="ok">Simpan</button></div>`);
 let img='';
 $('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)};
 $('#ok').onclick=()=>{const t=$('#t').value.trim();if(!t){$('#t').focus();return}S.mem.push({id:Date.now(),title:t,date:$('#d').value||today(),place:$('#p').value.trim(),story:$('#s').value.trim(),img});save();closeM();mem();hearts(10)}
}

/* musik: dibuat langsung dengan WebAudio, tanpa file */
const N={C4:262,D4:294,E4:330,G4:392,A4:440,C5:523,D5:587,E5:659,G5:784,A5:880,F3:175,C3:131,G3:196,A3:220,_:0};
const TR=[
 {n:'Sore Santai (lo-fi)',bpm:72,type:'triangle',m:'E5 _ D5 C5 _ A4 C5 _ D5 _ E5 G5 _ E5 D5 _'.split(' '),b:'C3 _ _ _ G3 _ _ _ A3 _ _ _ F3 _ _ _'.split(' ')},
 {n:'Piknik Ceria',bpm:112,type:'sine',m:'C5 E5 G5 E5 A5 G5 E5 D5 C5 E5 G5 A5 G5 E5 D5 C5'.split(' '),b:'C3 _ G3 _ C3 _ G3 _ F3 _ C3 _ G3 _ C3 _'.split(' ')},
 {n:'Malam Berdua',bpm:60,type:'sine',m:'A4 _ C5 _ E5 _ D5 _ C5 _ A4 _ G4 _ _ _'.split(' '),b:'A3 _ _ _ _ _ _ _ F3 _ _ _ G3 _ _ _'.split(' ')}];
let ac,mg,playing=false,step=0,tm,nt;
function tone(f,t,d,type,g){if(!f)return;const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(mg);o.start(t);o.stop(t+d+.05)}
function applyVol(){if(mg)mg.gain.value=S.mute?0:S.vol}
function tick(){const t=TR[S.tr],dur=60/t.bpm/2;tone(N[t.m[step%t.m.length]],ac.currentTime+.02,dur*2.2,t.type,.35);tone(N[t.b[step%t.b.length]],ac.currentTime+.02,dur*3,'sine',.4);step++;tm=setTimeout(tick,dur*1000)}
function startM(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination)}ac.resume();applyVol();if(playing)return;playing=true;step=0;tick();nt=setInterval(()=>floatEl(['♪','♫','♬'][Math.random()*3|0],Math.random()*90,4),900);upd()}
function stopM(){playing=false;clearTimeout(tm);clearInterval(nt);upd()}
function upd(){const d=$('#disc');if(!d)return;d.classList.toggle('spin',playing);$('#pp').textContent=playing?'⏸':'▶';$('#tn').textContent=TR[S.tr].n;$('#mt').textContent=S.mute?'🔇':'🔊'}
function mus(){
 $('#main').innerHTML=`<h2>Musik kita 🎵</h2><div class="disc" id="disc">💿</div><h3 class="hand" id="tn" style="text-align:center;font-size:24px"></h3>
 <div class="ctrl"><button class="btn alt" id="pv">⏮</button><button class="btn" id="pp">▶</button><button class="btn alt" id="nx">⏭</button><button class="btn alt" id="mt">🔊</button></div>
 <div class="vol"><span>🔈</span><input type="range" id="vl" min="0" max="1" step=".05" value="${S.vol}"><span>🔊</span></div>
 <p class="meta" style="text-align:center">Musik dimainkan langsung dari aplikasi, jadi tetap jalan tanpa internet.</p>`;
 upd();
 $('#pp').onclick=()=>playing?stopM():startM();
 const go=d=>{S.tr=(S.tr+d+TR.length)%TR.length;save();const w=playing;stopM();if(w)startM();upd()};
 $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
 $('#mt').onclick=()=>{S.mute=!S.mute;applyVol();save();upd()};
 $('#vl').oninput=e=>{S.vol=+e.target.value;S.mute=false;applyVol();save();upd()};
}

/* surat */
function letters(){
 const L=[...S.let].sort((a,b)=>a.open<b.open?1:-1);
 $('#main').innerHTML=`<div class="sect-h"><h2>Surat cinta 💌</h2><button class="btn sm" id="add">+ Tulis</button></div>
 ${L.length?L.map(l=>{const lock=l.open>today();return `<div class="env ${lock?'lock':''}" data-id="${l.id}"><div class="ic">${lock?'🔒':'💌'}</div><div><b class="hand" style="font-size:20px">Untuk ${esc(l.to||'kamu')}</b><div class="meta">${lock?'Bisa dibuka '+fmt(l.open):'Ditulis '+fmt(l.date)}</div></div></div>`}).join(''):'<div class="hint hand" style="font-size:20px">Belum ada surat.<br>Tulis pesan manis untuk dibuka nanti 💕</div>'}`;
 $('#add').onclick=()=>{modal(`<h2>Surat baru 💌</h2><label>Untuk</label><input id="to" value="${esc(S.n2)}"><label>Isi surat</label><textarea id="tx" rows="6" placeholder="Sayang, hari ini aku mau bilang..."></textarea><label>Boleh dibuka mulai tanggal</label><input id="op" type="date" value="${today()}"><div class="row"><button class="btn alt" data-x>Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  $('#ok').onclick=()=>{const tx=$('#tx').value.trim();if(!tx){$('#tx').focus();return}S.let.push({id:Date.now(),to:$('#to').value.trim(),text:tx,date:today(),open:$('#op').value||today()});save();closeM();letters()}};
 $('#main').onclick=e=>{const el=e.target.closest('.env');if(!el)return;const l=S.let.find(x=>x.id==el.dataset.id);
  if(l.open>today()){modal(`<div style="text-align:center"><div style="font-size:60px">🔒</div><h3 class="hand" style="font-size:24px">Sabar ya, sayang</h3><p>Surat ini baru bisa dibuka pada ${fmt(l.open)}.</p><button class="btn" data-x>Oke</button></div>`);return}
  modal(`<div class="stage" id="st"><div class="paper hand">Untuk ${esc(l.to)} ♥</div><div class="env3"></div><div class="flap"></div></div><div id="lt"></div><div class="row"><button class="btn alt" id="dl">Hapus</button><button class="btn" data-x>Tutup</button></div>`);
  setTimeout(()=>{$('#st').classList.add('open');hearts(18);setTimeout(()=>{$('#st').style.display='none';$('#lt').innerHTML=`<div class="letter hand"><b>Untuk ${esc(l.to||'kamu')},</b>\n${esc(l.text)}\n\n<span class="meta">${fmt(l.date)} 💗</span></div>`;hearts(10)},1700)},150);
  $('#dl').onclick=()=>{if(confirm('Hapus surat ini?')){S.let=S.let.filter(x=>x.id!=l.id);save();closeM();letters()}}}
}
render();
</script></body></html>
